# Local Streamlit settings. Keep this file small and Windows-friendly.

[browser]
gatherUsageStats = false

[client]
# Hide Deploy, Rerun, Clear cache, and the top-right menu on localhost.
# "viewer" would keep the theme / print menu. Analysts do not need either.
toolbarMode = "minimal"

[server]
# Avoid the file watcher touching llama.dll / GGUF files during a long CPU load.
fileWatcherType = "poll"
# Keep the websocket alive while a 7B CPU reply runs in a background thread.
websocketPingInterval = 10

[runner]
fastReruns = true

# Streamlit's default primaryColor is #FF4B4B (error/danger red).
# Use a dark gray for selection, primary buttons, and input focus.
# Reserve red for real errors only (st.error, load failures).
[theme]
primaryColor = "#3d3d3d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#1a1a1a"
